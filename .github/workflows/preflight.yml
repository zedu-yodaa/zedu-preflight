name: Preflight

# Push / PR / Run now / Nightly → Playwright on staging → verdict → dashboard.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # "Run workflow" button
  schedule:
    - cron: "0 2 * * *"     # nightly, 02:00 UTC

permissions:
  contents: read            # read-only token (PRD security rule)

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging    # holds the secrets below
    env:
      CI: "true"
      ZEDU_BASE_URL: ${{ vars.ZEDU_BASE_URL }}
      ZEDU_TEST_EMAIL: ${{ secrets.ZEDU_TEST_EMAIL }}
      ZEDU_TEST_PASSWORD: ${{ secrets.ZEDU_TEST_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true   # failures are judged by the next step, not here

      - name: Process results and send to dashboard
        if: always()
        run: node scripts/process-results.mjs --report results.json --out results-payload.json --fail-on-not-ready
        env:
          PREFLIGHT_RESULTS_URL: ${{ vars.PREFLIGHT_RESULTS_URL }}
          PREFLIGHT_API_KEY: ${{ secrets.PREFLIGHT_API_KEY }}
          PREFLIGHT_PROJECT: zedu
          PREFLIGHT_ENVIRONMENT: staging

      - name: Upload evidence (report, screenshots, traces)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-evidence
          path: |
            results.json
            results-payload.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
